services:
  web:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: docker-laravel
    ports:
      - 8000:8000
    volumes:
      - .:/app
      - /app/vendor
    depends_on:
      - db

  db:
    image: mysql:latest
    environment:
      MYSQL_DATABASE: godashop
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - ./storage/dbdata:/var/lib/mysql
    ports:
      - 3306:3306

